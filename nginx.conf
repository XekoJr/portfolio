server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança base (site estático — sem cookies nem auth)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Site de página única — fallback para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados agressivamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # .mjs não está no mime.types do nginx — sem isto os ES modules das
    # apps WASM (/apps/*) são recusados pelo browser (octet-stream)
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
